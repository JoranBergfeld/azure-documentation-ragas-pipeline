[project]
name = "ragpipe"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "agent-framework",
    "agent-framework-foundry",
    "azure-search-documents>=11.5.0",
    "azure-ai-projects>=2.0.0",
    "azure-identity",
    # Pinned exact: RAGAS metric prompts/APIs change across versions and legacy
    # metrics are slated for removal by v1.0, so an unpinned judge silently
    # re-anchors every faithfulness score. Bump deliberately + recalibrate the
    # gate threshold and re-baseline the canary in the same change (ADR-0018).
    "ragas==0.4.3",
    "langchain-openai",
    "streamlit",
    "pyyaml",
    "python-dotenv",
    "httpx",
    "beautifulsoup4",
    "fastapi",
    "uvicorn[standard]",
    "rapidfuzz",
    "markdownify>=1.2.2",
    "langchain-anthropic>=1.4.4",
    "anthropic>=0.109.1",
    "scikit-learn>=1.5",
]

[dependency-groups]
dev = ["pytest", "pytest-asyncio", "pytest-mock", "ruff", "matplotlib"]

[tool.uv]
# agent-framework currently ships only pre-release (beta) builds, and
# azure-search-documents pulls a pre-release marker; allow them so `uv sync`
# / `uv lock` resolve without needing --prerelease=allow on the CLI.
prerelease = "allow"

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
