[project]
name = "ragpipe"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "agent-framework",
    "agent-framework-foundry",
    "azure-search-documents>=11.5.0",
    "azure-ai-projects>=2.0.0",
    "azure-identity",
    "ragas",
    "langchain-openai",
    "streamlit",
    "pyyaml",
    "python-dotenv",
    "httpx",
    "beautifulsoup4",
    "fastapi",
    "uvicorn[standard]",
    "rapidfuzz",
]

[dependency-groups]
dev = ["pytest", "pytest-asyncio", "pytest-mock", "ruff"]

[tool.uv]
# agent-framework currently ships only pre-release (beta) builds, and
# azure-search-documents pulls a pre-release marker; allow them so `uv sync`
# / `uv lock` resolve without needing --prerelease=allow on the CLI.
prerelease = "allow"

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
