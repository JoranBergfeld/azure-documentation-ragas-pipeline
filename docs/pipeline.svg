<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 700" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,3 L0,6 Z" fill="#6B7A88"/>
    </marker>
    <marker id="arrowAz" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,3 L0,6 Z" fill="#0078D4"/>
    </marker>
    <marker id="arrowTeal" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,3 L0,6 Z" fill="#2E9E4B"/>
    </marker>
  </defs>

  <!-- canvas -->
  <rect x="0" y="0" width="1180" height="700" rx="14" fill="#FFFFFF"/>

  <!-- title + legend -->
  <text x="32" y="34" font-size="22" font-weight="700" fill="#1B2733">RAGAS-infused RAG pipeline</text>
  <text x="32" y="52" font-size="13" fill="#5B6B7B">Hybrid retrieval → rerank → Foundry agent → faithfulness guardrail, evaluated with RAGAS</text>
  <g font-size="11.5" fill="#5B6B7B">
    <rect x="760" y="22" width="13" height="13" rx="3" fill="#E3F0FB" stroke="#0078D4"/><text x="779" y="32">Azure AI service</text>
    <rect x="900" y="22" width="13" height="13" rx="3" fill="#F0EAFA" stroke="#8661C5"/><text x="919" y="32">Foundry agent</text>
    <rect x="1028" y="22" width="13" height="13" rx="3" fill="#E5F5E9" stroke="#2E9E4B"/><text x="1047" y="32">RAGAS / eval</text>
  </g>

  <!-- ================= BAND A: INGEST ================= -->
  <rect x="24" y="64" width="1132" height="104" rx="12" fill="#F5F8FB" stroke="#D6E4F0"/>
  <text x="40" y="86" font-size="13" font-weight="700" fill="#5B6B7B">①  Ingest — build &amp; index the corpus (offline)</text>

  <g>
    <rect x="40" y="104" width="180" height="44" rx="8" fill="#EEF2F6" stroke="#9AA8B5" stroke-width="1.5"/>
    <text x="130" y="123" text-anchor="middle" font-size="13" font-weight="600" fill="#1B2733">build_corpus.py</text>
    <text x="130" y="138" text-anchor="middle" font-size="11" fill="#5B6B7B">crawl MS Learn sitemaps</text>
  </g>
  <g>
    <rect x="250" y="104" width="150" height="44" rx="8" fill="#FFF6E6" stroke="#E3B341" stroke-width="1.5"/>
    <text x="325" y="130" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1B2733">corpus_sources.yaml</text>
  </g>
  <g>
    <rect x="430" y="104" width="240" height="44" rx="8" fill="#EEF2F6" stroke="#9AA8B5" stroke-width="1.5"/>
    <text x="550" y="123" text-anchor="middle" font-size="13" font-weight="600" fill="#1B2733">ragpipe.ingest</text>
    <text x="550" y="138" text-anchor="middle" font-size="11" fill="#5B6B7B">fetch · chunk · embed · prune stale</text>
  </g>
  <g>
    <rect x="700" y="104" width="190" height="44" rx="8" fill="#E3F0FB" stroke="#0078D4" stroke-width="1.5"/>
    <text x="795" y="130" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1B2733">Azure AI Search index</text>
  </g>

  <path d="M220,126 L246,126" stroke="#6B7A88" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
  <path d="M400,126 L426,126" stroke="#6B7A88" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
  <path d="M670,126 L696,126" stroke="#6B7A88" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>

  <!-- ================= BAND B: QUERY PIPELINE ================= -->
  <rect x="24" y="188" width="1132" height="316" rx="12" fill="#FAF7FD" stroke="#E2D6F0"/>
  <text x="40" y="210" font-size="13" font-weight="700" fill="#5B6B7B">②  Query pipeline — Microsoft Agent Framework Workflow (runtime)</text>

  <!-- index feeds the two retrievers -->
  <path d="M760,150 C 620,206 380,214 290,256" stroke="#0078D4" stroke-width="1.4" stroke-dasharray="5 4" opacity="0.6" fill="none" marker-end="url(#arrowAz)"/>
  <path d="M800,150 C 770,330 470,378 364,398" stroke="#0078D4" stroke-width="1.4" stroke-dasharray="5 4" opacity="0.6" fill="none" marker-end="url(#arrowAz)"/>
  <text x="520" y="240" font-size="11" fill="#0078D4" opacity="0.85">queries index</text>

  <g>
    <rect x="40" y="300" width="110" height="44" rx="8" fill="#EEF2F6" stroke="#9AA8B5" stroke-width="1.5"/>
    <text x="95" y="327" text-anchor="middle" font-size="13" font-weight="600" fill="#1B2733">Question</text>
  </g>
  <g>
    <rect x="210" y="252" width="150" height="44" rx="8" fill="#E3F0FB" stroke="#5AA0DC" stroke-width="1.5"/>
    <text x="285" y="271" text-anchor="middle" font-size="13" font-weight="600" fill="#1B2733">Dense retrieval</text>
    <text x="285" y="286" text-anchor="middle" font-size="11" fill="#5B6B7B">embeddings · vector</text>
  </g>
  <g>
    <rect x="210" y="372" width="150" height="44" rx="8" fill="#E3F0FB" stroke="#5AA0DC" stroke-width="1.5"/>
    <text x="285" y="391" text-anchor="middle" font-size="13" font-weight="600" fill="#1B2733">BM25 retrieval</text>
    <text x="285" y="406" text-anchor="middle" font-size="11" fill="#5B6B7B">keyword</text>
  </g>
  <g>
    <rect x="410" y="300" width="120" height="44" rx="8" fill="#EEF2F6" stroke="#9AA8B5" stroke-width="1.5"/>
    <text x="470" y="320" text-anchor="middle" font-size="13" font-weight="600" fill="#1B2733">RRF fusion</text>
    <text x="470" y="335" text-anchor="middle" font-size="11" fill="#5B6B7B">reciprocal rank</text>
  </g>
  <g>
    <rect x="580" y="300" width="150" height="44" rx="8" fill="#E3F0FB" stroke="#0078D4" stroke-width="1.5"/>
    <text x="655" y="320" text-anchor="middle" font-size="13" font-weight="600" fill="#1B2733">Azure semantic</text>
    <text x="655" y="335" text-anchor="middle" font-size="11" fill="#5B6B7B">reranker</text>
  </g>
  <g>
    <rect x="760" y="300" width="210" height="44" rx="8" fill="#F0EAFA" stroke="#8661C5" stroke-width="1.5"/>
    <text x="865" y="320" text-anchor="middle" font-size="13" font-weight="600" fill="#1B2733">Foundry generator agent</text>
    <text x="865" y="335" text-anchor="middle" font-size="11" fill="#5B6B7B">+ Code Interpreter tool</text>
  </g>
  <g>
    <rect x="1010" y="300" width="146" height="44" rx="8" fill="#E5F5E9" stroke="#107C10" stroke-width="1.5"/>
    <text x="1083" y="320" text-anchor="middle" font-size="13" font-weight="600" fill="#1B2733">Answer</text>
    <text x="1083" y="335" text-anchor="middle" font-size="11" fill="#5B6B7B">grounded + citations</text>
  </g>
  <g>
    <rect x="760" y="410" width="210" height="44" rx="8" fill="#E5F5E9" stroke="#2E9E4B" stroke-width="1.5"/>
    <text x="865" y="430" text-anchor="middle" font-size="13" font-weight="600" fill="#1B2733">RAGAS faithfulness</text>
    <text x="865" y="445" text-anchor="middle" font-size="11" fill="#5B6B7B">guardrail</text>
  </g>

  <!-- flow -->
  <path d="M150,312 L206,276" stroke="#6B7A88" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
  <path d="M150,332 L206,392" stroke="#6B7A88" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
  <path d="M360,278 L406,314" stroke="#6B7A88" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
  <path d="M360,390 L406,330" stroke="#6B7A88" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
  <path d="M530,322 L576,322" stroke="#6B7A88" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
  <path d="M730,322 L756,322" stroke="#6B7A88" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
  <path d="M865,344 L865,406" stroke="#6B7A88" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
  <!-- guardrail passes -> answer -->
  <path d="M970,432 C 1083,432 1083,372 1083,348" stroke="#2E9E4B" stroke-width="1.6" fill="none" marker-end="url(#arrowTeal)"/>
  <text x="1000" y="400" font-size="11" font-weight="600" fill="#2E9E4B">faithful ≥ θ</text>
  <!-- guardrail fails -> retry from RRF -->
  <path d="M812,454 L812,482 L470,482 L470,346" stroke="#2E9E4B" stroke-width="1.6" stroke-dasharray="6 4" fill="none" marker-end="url(#arrowTeal)"/>
  <text x="566" y="476" font-size="11" font-weight="600" fill="#2E9E4B">unfaithful &lt; θ — retry (max N)</text>

  <!-- ================= BAND C: EVAL ================= -->
  <rect x="24" y="524" width="1132" height="152" rx="12" fill="#F3FAF4" stroke="#CDE9D2"/>
  <text x="40" y="546" font-size="13" font-weight="700" fill="#5B6B7B">③  Evaluation — RAGAS (offline)</text>

  <!-- eval replays the pipeline -->
  <path d="M470,504 L390,576" stroke="#9AA8B5" stroke-width="1.5" stroke-dasharray="6 4" fill="none" marker-end="url(#arrow)"/>
  <text x="440" y="548" font-size="11" fill="#5B6B7B">eval replays ②</text>

  <g>
    <rect x="40" y="576" width="200" height="44" rx="8" fill="#EEF2F6" stroke="#9AA8B5" stroke-width="1.5"/>
    <text x="140" y="595" text-anchor="middle" font-size="13" font-weight="600" fill="#1B2733">Test set</text>
    <text x="140" y="610" text-anchor="middle" font-size="11" fill="#5B6B7B">handauthored | synthetic</text>
  </g>
  <g>
    <rect x="290" y="576" width="150" height="44" rx="8" fill="#EEF2F6" stroke="#9AA8B5" stroke-width="1.5"/>
    <text x="365" y="602" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1B2733">Run pipeline ②</text>
  </g>
  <g>
    <rect x="490" y="576" width="300" height="44" rx="8" fill="#E5F5E9" stroke="#2E9E4B" stroke-width="1.5"/>
    <text x="640" y="595" text-anchor="middle" font-size="13" font-weight="600" fill="#1B2733">RAGAS metrics</text>
    <text x="640" y="610" text-anchor="middle" font-size="11" fill="#5B6B7B">faithfulness · answer relevancy · context P/R (per-stage)</text>
  </g>
  <g>
    <rect x="830" y="576" width="150" height="44" rx="8" fill="#FFF6E6" stroke="#E3B341" stroke-width="1.5"/>
    <text x="905" y="602" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1B2733">eval_results.json</text>
  </g>
  <g>
    <rect x="1010" y="576" width="146" height="44" rx="8" fill="#EEF2F6" stroke="#9AA8B5" stroke-width="1.5"/>
    <text x="1083" y="595" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1B2733">Streamlit dashboard</text>
    <text x="1083" y="610" text-anchor="middle" font-size="11" fill="#5B6B7B">Run · Eval · Arch</text>
  </g>

  <path d="M240,598 L286,598" stroke="#6B7A88" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
  <path d="M440,598 L486,598" stroke="#6B7A88" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
  <path d="M790,598 L826,598" stroke="#6B7A88" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
  <path d="M980,598 L1006,598" stroke="#6B7A88" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
</svg>
