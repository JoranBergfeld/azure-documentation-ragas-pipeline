<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 700" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,3 L0,6 Z" fill="#6B7A88"/>
    </marker>
    <marker id="arrowAz" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,3 L0,6 Z" fill="#0078D4"/>
    </marker>
    <marker id="arrowTeal" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,3 L0,6 Z" fill="#2E9E4B"/>
    </marker>
    <marker id="arrowPurple" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,3 L0,6 Z" fill="#8661C5"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1180" height="700" rx="14" fill="#FFFFFF"/>

  <text x="32" y="34" font-size="22" font-weight="700" fill="#1B2733">Retrieval substrate seam</text>
  <text x="32" y="52" font-size="13" fill="#5B6B7B">One RetrievalSubstrate interface (name + async retrieve) · 9 modes over multiple Azure AI Search indexes (ADR-0012)</text>

  <!-- legend -->
  <rect x="690" y="22" width="13" height="13" rx="3" fill="#E3F0FB" stroke="#0078D4"/>
  <text x="709" y="33" font-size="12" fill="#5B6B7B">Azure AI Search index</text>
  <rect x="858" y="22" width="13" height="13" rx="3" fill="#F0EAFA" stroke="#8661C5"/>
  <text x="877" y="33" font-size="12" fill="#5B6B7B">Foundry / agentic</text>
  <rect x="1008" y="22" width="13" height="13" rx="3" fill="#E5F5E9" stroke="#2E9E4B"/>
  <text x="1027" y="33" font-size="12" fill="#5B6B7B">RAGAS / answer</text>

  <!-- column headers -->
  <text x="28" y="78" font-size="12" font-weight="700" fill="#9AA8B5">INDEXES</text>
  <text x="300" y="78" font-size="12" font-weight="700" fill="#9AA8B5">SUBSTRATES — one retrieve() per mode</text>
  <text x="830" y="78" font-size="12" font-weight="700" fill="#9AA8B5">SHARED TAIL</text>

  <!-- ===== Column 1: indexes ===== -->
  <g>
    <rect x="28" y="96" width="206" height="44" rx="8" fill="#E3F0FB" stroke="#0078D4" stroke-width="1.5"/>
    <text x="131" y="115" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1B2733">contextual</text>
    <text x="131" y="130" text-anchor="middle" font-size="10" fill="#5B6B7B">contextual chunks · Foundry-bound (ADR-0007)</text>
  </g>
  <g>
    <rect x="28" y="148" width="206" height="44" rx="8" fill="#E3F0FB" stroke="#0078D4" stroke-width="1.5"/>
    <text x="131" y="167" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1B2733">baseline</text>
    <text x="131" y="182" text-anchor="middle" font-size="10" fill="#5B6B7B">plain chunks · no contextual decoration</text>
  </g>
  <g>
    <rect x="28" y="200" width="206" height="44" rx="8" fill="#E3F0FB" stroke="#0078D4" stroke-width="1.5"/>
    <text x="131" y="219" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1B2733">raptor-sac</text>
    <text x="131" y="234" text-anchor="middle" font-size="9.5" fill="#5B6B7B">contextual leaves + RAPTOR summaries (ADR-0013)</text>
  </g>
  <g>
    <rect x="28" y="288" width="206" height="40" rx="8" fill="#E3F0FB" stroke="#0078D4" stroke-width="1.5"/>
    <text x="131" y="305" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1B2733">graph-entities</text>
    <text x="131" y="319" text-anchor="middle" font-size="10" fill="#5B6B7B">entity descriptions</text>
  </g>
  <g>
    <rect x="28" y="334" width="206" height="40" rx="8" fill="#E3F0FB" stroke="#0078D4" stroke-width="1.5"/>
    <text x="131" y="351" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1B2733">graph-relationships</text>
    <text x="131" y="365" text-anchor="middle" font-size="10" fill="#5B6B7B">edges → adjacency</text>
  </g>
  <g>
    <rect x="28" y="380" width="206" height="40" rx="8" fill="#E3F0FB" stroke="#0078D4" stroke-width="1.5"/>
    <text x="131" y="397" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1B2733">graph-communities</text>
    <text x="131" y="411" text-anchor="middle" font-size="10" fill="#5B6B7B">community reports</text>
  </g>
  <!-- brace grouping the three graph indexes -->
  <path d="M240,288 C 250,288 250,350 258,354 C 250,358 250,420 240,420" stroke="#0078D4" stroke-width="1.4" fill="none" opacity="0.7"/>
  <text x="270" y="358" transform="rotate(-90 270 358)" text-anchor="middle" font-size="10.5" font-weight="600" fill="#0078D4">GraphRAG graph · ADR-0014</text>

  <!-- ===== Column 2: substrates ===== -->
  <text x="300" y="92" font-size="10.5" font-weight="600" fill="#8661C5">HybridSubstrate — dense + BM25 → RRF (contextual · baseline · raptor-sac)</text>
  <g>
    <rect x="300" y="100" width="214" height="44" rx="8" fill="#EEF2F6" stroke="#9AA8B5" stroke-width="1.5"/>
    <text x="407" y="119" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1B2733">Contextual</text>
    <text x="407" y="134" text-anchor="middle" font-size="10" fill="#5B6B7B">hybrid over the contextual index</text>
  </g>
  <g>
    <rect x="300" y="152" width="214" height="44" rx="8" fill="#EEF2F6" stroke="#9AA8B5" stroke-width="1.5"/>
    <text x="407" y="171" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1B2733">Baseline</text>
    <text x="407" y="186" text-anchor="middle" font-size="10" fill="#5B6B7B">hybrid over the baseline index</text>
  </g>
  <g>
    <rect x="300" y="204" width="214" height="44" rx="8" fill="#EEF2F6" stroke="#9AA8B5" stroke-width="1.5"/>
    <text x="407" y="223" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1B2733">RAPTOR/contextual</text>
    <text x="407" y="238" text-anchor="middle" font-size="10" fill="#5B6B7B">collapsed tree — one hybrid over all levels</text>
  </g>
  <g>
    <rect x="300" y="324" width="214" height="44" rx="8" fill="#EEF2F6" stroke="#9AA8B5" stroke-width="1.5"/>
    <text x="407" y="343" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1B2733">GraphRAG</text>
    <text x="407" y="358" text-anchor="middle" font-size="10" fill="#5B6B7B">local (ents+adj) ⊕ global (reports) → RRF</text>
  </g>
  <g>
    <rect x="300" y="436" width="214" height="44" rx="8" fill="#EEF2F6" stroke="#9AA8B5" stroke-width="1.5"/>
    <text x="407" y="455" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1B2733">Combined</text>
    <text x="407" y="470" text-anchor="middle" font-size="10" fill="#5B6B7B">RRF-fuse RAPTOR/contextual ⊕ GraphRAG candidates</text>
  </g>

  <!-- index -> substrate -->
  <path d="M234,118 L296,120" stroke="#6B7A88" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M234,170 L296,172" stroke="#6B7A88" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M234,222 L296,224" stroke="#6B7A88" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M234,308 C 268,322 270,340 296,344" stroke="#6B7A88" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M234,354 L296,346" stroke="#6B7A88" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M234,400 C 268,388 270,352 296,348" stroke="#6B7A88" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <!-- RAPTOR/contextual and GraphRAG feed Combined -->
  <path d="M360,248 C 350,300 352,420 372,432" stroke="#6B7A88" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M452,368 C 460,400 452,420 444,432" stroke="#6B7A88" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <text x="356" y="408" font-size="13" font-weight="700" fill="#9AA8B5">⊕</text>

  <!-- ===== merge bus for the four wrappable substrates ===== -->
  <path d="M545,168 L545,460" stroke="#9AA8B5" stroke-width="1.4" fill="none" opacity="0.65"/>
  <path d="M514,172 L541,172" stroke="#6B7A88" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M514,224 L541,224" stroke="#6B7A88" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M514,344 L541,344" stroke="#6B7A88" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M514,456 L541,456" stroke="#6B7A88" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <!-- base-mode path: bus -> rerank (direct) -->
  <path d="M545,168 L545,150 L826,150" stroke="#6B7A88" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
  <text x="630" y="143" font-size="10.5" fill="#5B6B7B">base modes → tail</text>

  <!-- contextual (not wrappable) -> rerank along the top -->
  <path d="M514,118 L700,118 L700,138 L826,138" stroke="#6B7A88" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
  <text x="556" y="112" font-size="10.5" fill="#5B6B7B">contextual (no agentic variant)</text>

  <!-- ===== agentic wrapper ===== -->
  <g>
    <rect x="586" y="372" width="232" height="78" rx="8" fill="#F0EAFA" stroke="#8661C5" stroke-width="1.5"/>
    <text x="702" y="396" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1B2733">AgenticSubstrate(inner)</text>
    <text x="702" y="412" text-anchor="middle" font-size="9.5" fill="#5B6B7B">bounded plan → retrieve loop · iter_N stages</text>
    <text x="702" y="426" text-anchor="middle" font-size="9.5" fill="#5B6B7B">baseline · raptor_sac · graphrag · combined</text>
    <text x="702" y="440" text-anchor="middle" font-size="9.5" fill="#8661C5">*_agentic (ADR-0015) — no contextual_agentic</text>
  </g>
  <!-- agentic path: bus -> wrapper -> rerank (dashed purple) -->
  <path d="M545,420 L582,411" stroke="#8661C5" stroke-width="1.5" stroke-dasharray="5 4" fill="none" marker-end="url(#arrowPurple)"/>
  <path d="M740,372 L740,158 L822,158" stroke="#8661C5" stroke-width="1.5" stroke-dasharray="5 4" fill="none" marker-end="url(#arrowPurple)"/>
  <text x="724" y="468" font-size="10.5" fill="#8661C5">agentic modes → tail</text>

  <!-- ===== shared tail ===== -->
  <g>
    <rect x="826" y="112" width="320" height="50" rx="8" fill="#E3F0FB" stroke="#0078D4" stroke-width="1.5"/>
    <text x="986" y="132" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1B2733">SemanticReranker</text>
    <text x="986" y="147" text-anchor="middle" font-size="10" fill="#5B6B7B">over substrate candidates · widens on retry</text>
  </g>
  <g>
    <rect x="826" y="214" width="320" height="50" rx="8" fill="#F0EAFA" stroke="#8661C5" stroke-width="1.5"/>
    <text x="986" y="234" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1B2733">Foundry generator agent</text>
    <text x="986" y="249" text-anchor="middle" font-size="10" fill="#5B6B7B">gpt-5.4 · grounded prompt · + Code Interpreter</text>
  </g>
  <g>
    <rect x="826" y="316" width="320" height="50" rx="8" fill="#E5F5E9" stroke="#2E9E4B" stroke-width="1.5"/>
    <text x="986" y="336" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1B2733">RAGAS faithfulness gate</text>
    <text x="986" y="351" text-anchor="middle" font-size="10" fill="#5B6B7B">claude-sonnet-4-6 · θ=0.7 (ADR-0009/0011)</text>
  </g>
  <g>
    <rect x="826" y="418" width="320" height="50" rx="8" fill="#E5F5E9" stroke="#107C10" stroke-width="1.5"/>
    <text x="986" y="438" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1B2733">Answer  /  abstain</text>
    <text x="986" y="453" text-anchor="middle" font-size="10" fill="#5B6B7B">grounded + citations · or ABSTENTION_ANSWER (ADR-0009)</text>
  </g>
  <path d="M986,162 L986,210" stroke="#6B7A88" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
  <path d="M986,264 L986,312" stroke="#6B7A88" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
  <path d="M986,366 L986,414" stroke="#2E9E4B" stroke-width="1.6" fill="none" marker-end="url(#arrowTeal)"/>
  <!-- retry: gate widens window back at reranker -->
  <path d="M1148,340 C 1166,300 1166,182 1148,152" stroke="#2E9E4B" stroke-width="1.5" stroke-dasharray="6 4" fill="none" marker-end="url(#arrowTeal)"/>
  <text x="1118" y="246" transform="rotate(-90 1118 246)" text-anchor="middle" font-size="10" font-weight="600" fill="#2E9E4B">unfaithful &lt; θ — widen &amp; retry (max N)</text>

  <!-- footer -->
  <text x="32" y="560" font-size="10.5" fill="#5B6B7B">PipelineState.stages is a dynamic dict[str, list[Chunk]] — each substrate names its own stages (dense·bm25·fused | local·global·fused | iter_N); the final set is always mirrored as "reranked".</text>
  <text x="32" y="582" font-size="10.5" fill="#5B6B7B">Adding a strategy = implement the protocol, add an index in Settings, register it in retrieval/registry.py — nothing downstream of retrieve() changes.</text>
  <text x="32" y="604" font-size="10.5" font-weight="600" fill="#8661C5">5 base substrates + 4 agentic wrappers = 9 registered modes (registry.registered_modes()).</text>
</svg>
