name: publish-image

# Build the container image and push it to GHCR on every push to main, so the
# homelab personal-website stack can pull
# ghcr.io/joranbergfeld/azure-documentation-ragas-pipeline:latest.
#
# Mirrors the publish job in JoranBergfeld/personal-website (.github/workflows/ci.yml).
on:
  push:
    branches: [main]
  workflow_dispatch:

# Cancel an in-flight build for the same ref when a newer push lands.
concurrency:
  group: publish-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    name: build + push · ghcr.io
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push to GHCR with GITHUB_TOKEN — no PAT needed.
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          # github.repository is "JoranBergfeld/azure-documentation-ragas-pipeline";
          # metadata-action lowercases it to the GHCR-legal image name.
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=,format=short
          labels: |
            org.opencontainers.image.title=azure-documentation-ragas-pipeline
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=RAGAS-evaluated RAG pipeline HTTP API

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Reuse layers across runs via the GitHub Actions cache backend.
          cache-from: type=gha
          cache-to: type=gha,mode=max
